<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D8F5FC">
  <title>Australia at Metstrade 2026 — Delegate Map</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=brandgc-v5">
  <link rel="stylesheet" href="map.css?v=brandgc-v5">
  <script src="cursor.js?v=brandgc-v5" defer></script>
  <script src="map.js?v=brandgc-v5" defer></script>
</head>
<body class="map-view">
  <main class="map-shell">
    <a class="map-back" href="index.html">← Business profiles</a>
    <header class="map-header">
      <div><h1>Metstrade Delegate Map</h1><p>Find Australia in Halls 3 &amp; 7.</p></div>
      <nav class="map-tools" aria-label="Map actions">
        <a href="assets/maps/metstrade-australia-2026.svg" download="Metstrade-2026-Australia-Map.svg">Download map <span aria-hidden="true">↓</span></a>
        <button id="print-map" type="button">Print / save PDF</button>
      </nav>
    </header>
    <figure class="map-figure">
      <a href="assets/maps/metstrade-australia-2026.svg" aria-label="Open the full-size Australian delegate map">
        <picture>
          <source media="print" srcset="assets/maps/metstrade-australia-2026.svg">
          <img src="assets/maps/metstrade-australia-2026-web.svg" width="2800" height="2835" alt="Official Metstrade 2026 floorplan. Yellow callouts identify the Australian flag beside Hall 3 and the Australian flag above Hall 7.">
        </picture>
      </a>
    </figure>
  </main>
  <div class="cursor-dot" aria-hidden="true"></div>
</body>
</html>
